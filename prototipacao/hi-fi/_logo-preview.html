<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>body{margin:0;display:grid;gap:26px;place-items:center;padding:36px;background:#1c4fa1}
.row{display:flex;gap:24px;align-items:center;background:#0f2f63;padding:14px 22px;border-radius:14px}
.claro{background:#fdf6ee;padding:16px 24px;border-radius:14px}</style>
</head><body>

<svg id="logo" width="520" height="235" viewBox="0 0 520 235" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rifiiis">
  <defs>
    <linearGradient id="lg-or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a623"/><stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
    <linearGradient id="lg-ph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafd"/><stop offset="1" stop-color="#c9d8ec"/>
    </linearGradient>
    <linearGradient id="lg-cl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc93e"/><stop offset="1" stop-color="#379d26"/>
    </linearGradient>
    <g id="trevo">
      <!-- caule -->
      <path d="M0 16 q5 15 -3 28" fill="none" stroke="#14243a" stroke-width="9" stroke-linecap="round"/>
      <path d="M0 16 q5 15 -3 28" fill="none" stroke="url(#lg-cl)" stroke-width="4" stroke-linecap="round"/>
      <!-- 3 lóbulos: contorno -->
      <circle cx="-15" cy="2" r="15" fill="url(#lg-cl)" stroke="#14243a" stroke-width="7"/>
      <circle cx="15" cy="2" r="15" fill="url(#lg-cl)" stroke="#14243a" stroke-width="7"/>
      <circle cx="0" cy="-16" r="15" fill="url(#lg-cl)" stroke="#14243a" stroke-width="7"/>
      <!-- re-preenche para apagar traços internos -->
      <circle cx="-15" cy="2" r="12.5" fill="url(#lg-cl)"/>
      <circle cx="15" cy="2" r="12.5" fill="url(#lg-cl)"/>
      <circle cx="0" cy="-16" r="12.5" fill="url(#lg-cl)"/>
    </g>
  </defs>

  <!-- ===== camada adesivo: contorno branco grosso ===== -->
  <g transform="translate(414,40) rotate(7)">
    <rect x="0" y="0" width="94" height="176" rx="20" fill="none" stroke="#ffffff" stroke-width="24"/>
  </g>
  <text x="12" y="180" font-family="Nunito,sans-serif" font-weight="900" font-size="150"
        letter-spacing="-6" fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linejoin="round">RIF</text>
  <text x="246" y="180" font-family="Nunito,sans-serif" font-weight="900" font-size="150"
        letter-spacing="-4" fill="none" stroke="#ffffff" stroke-width="30"
        stroke-linejoin="round">IIIS</text>

  <!-- ===== celular ===== -->
  <g transform="translate(414,40) rotate(7)">
    <rect x="0" y="0" width="94" height="176" rx="20" fill="url(#lg-ph)" stroke="#14243a" stroke-width="9"/>
    <rect x="23" y="9" width="48" height="10" rx="5" fill="#14243a" opacity=".85"/>
  </g>

  <!-- ===== letras ===== -->
  <text x="12" y="180" font-family="Nunito,sans-serif" font-weight="900" font-size="150"
        letter-spacing="-6" fill="#ffffff" stroke="#14243a" stroke-width="13"
        paint-order="stroke" stroke-linejoin="round">RIF</text>
  <text x="246" y="180" font-family="Nunito,sans-serif" font-weight="900" font-size="150"
        letter-spacing="-4" fill="url(#lg-or)" stroke="#14243a" stroke-width="13"
        paint-order="stroke" stroke-linejoin="round">IIIS</text>

  <!-- ===== trevos ===== -->
  <use href="#trevo" transform="translate(163,42) scale(.95)"/>
  <use href="#trevo" transform="translate(305,30) scale(1.12)"/>
</svg>

<div class="claro">
  <svg width="280" height="127" viewBox="0 0 520 235"><use href="#logo"/></svg>
</div>

<div class="row">
  <svg width="130" height="59" viewBox="0 0 520 235" aria-hidden="true"><use href="#logo"/></svg>
  <svg width="86" height="39" viewBox="0 0 520 235" aria-hidden="true"><use href="#logo"/></svg>
</div>

</body></html>
